name: GF117 Nouveau module
on:
  workflow_dispatch:
  push:
    branches: ['ci/gf117-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl dwarves flex git kmod libedit2 \
            libelf-dev libicu70 libncurses6 libssl-dev libtinfo6 libxml2 \
            libz3-4 python3 ripgrep zstd
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Clang LLVM and LLD 23.1.1
        shell: bash
        run: bash ci/install-toolchain.sh
      - name: Build exact CachyOS module and check source harnesses
        shell: bash
        run: bash ci/build-gf117-module.sh
      - name: Upload module, manifest and complete log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gf117-nouveau-${{ github.sha }}
          path: ci-output/
          retention-days: 7
          compression-level: 0
