name: GF117 CachyOS 7.3 external build
on:
  push:
    branches: ['research/gf117-cachyos-7.3.0-4']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          echo 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main' > /etc/apt/sources.list.d/jammy-compat.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl dwarves flex git kmod libedit2 \
            libelf-dev libicu70 libncurses6 libssl-dev libtinfo6 libxml2 libsframe3 \
            libxxhash0 libz3-4 python3 ripgrep zstd
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out pinned Nouveau source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: CachyOS/linux
          ref: 6f1d90319ee9a72139f60d4547c2b44064ee2987
          sparse-checkout: drivers/gpu/drm/nouveau
          path: kernel-source
          persist-credentials: false
      - name: Cache verified downloads
        id: input-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ci-downloads
          key: gf117-73-headers-1320702b-llvm-23.1.3-14d2f701
      - name: Fetch and verify inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-downloads ci-output "$RUNNER_TEMP/headers" "$RUNNER_TEMP/llvm"
          headers=ci-downloads/linux-cachyos-headers-7.3.0-4-x86_64_v3.pkg.tar.zst
          llvm=ci-downloads/LLVM-23.1.3-Linux-X64.tar.zst
          test -f "$headers" || curl -fL --retry 3 -o "$headers" https://archive.cachyos.org/archive/cachyos-v3/linux-cachyos-headers-7.3.0-4-x86_64_v3.pkg.tar.zst
          test -f "$llvm" || curl -fL --retry 3 -o "$llvm" https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst
          echo '1320702b100adcb45e9493cbc5d1a3f5a5d74aa0ebc80f201f7078254b99f498  '"$headers" | sha256sum -c -
          echo '14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba  '"$llvm" | sha256sum -c -
      - name: Save verified inputs before building
        if: steps.input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ci-downloads
          key: gf117-73-headers-1320702b-llvm-23.1.3-14d2f701
      - name: Extract verified inputs
        shell: bash
        run: |
          set -euo pipefail
          zstd -dc --long=30 ci-downloads/linux-cachyos-headers-7.3.0-4-x86_64_v3.pkg.tar.zst | tar --no-same-owner -xf - -C "$RUNNER_TEMP/headers"
          zstd -dc --long=30 ci-downloads/LLVM-23.1.3-Linux-X64.tar.zst | tar --no-same-owner -xf - --strip-components=1 -C "$RUNNER_TEMP/llvm"
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
      - name: Apply and test source
        shell: bash
        run: |
          set -euo pipefail
          experimental/cachyos-7.3.0-4/apply-and-test.sh "$GITHUB_WORKSPACE/kernel-source" "$RUNNER_TEMP/gf117-73" 2>&1 | tee ci-output/source-check.log
      - name: Build module without installation
        shell: bash
        run: |
          set -euo pipefail
          kdir="$RUNNER_TEMP/headers/usr/lib/modules/7.3.0-4-cachyos/build"
          src="$RUNNER_TEMP/gf117-73/drivers/gpu/drm/nouveau"
          test "$(clang -dumpversion)" = 23.1.3
          test "$(make -s -C "$kdir" kernelrelease)" = 7.3.0-4-cachyos
          test -s "$kdir/Module.symvers"
          make -C "$kdir" LLVM=1 LLVM_IAS=1 -j"$(nproc)" M="$src" modules 2>&1 | tee ci-output/build.log
          module="$src/nouveau.ko"
          test "$(modinfo -F vermagic "$module" | awk '{print $1}')" = 7.3.0-4-cachyos
          cp "$kdir/.config" ci-output/kernel.config
          sha256sum "$module" "$kdir/Module.symvers" ci-output/kernel.config > ci-output/input-output.sha256
          { printf 'project_commit=%s\nkernel_source_commit=%s\nheaders_sha256=%s\nllvm_sha256=%s\narch=%s\ntests=source_harnesses_passed\n' "$GITHUB_SHA" "$(git -C kernel-source rev-parse HEAD)" 1320702b100adcb45e9493cbc5d1a3f5a5d74aa0ebc80f201f7078254b99f498 14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba "$(uname -m)"; clang --version; modinfo -F vermagic "$module"; } > ci-output/build-info.txt
          zstd -T0 -6 -o ci-output/nouveau.ko.zst "$module"
          sha256sum ci-output/nouveau.ko.zst > ci-output/nouveau.ko.zst.sha256
      - name: Upload logs and experimental artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gf117-73-build-${{ github.sha }}
          path: ci-output/
          if-no-files-found: warn
          retention-days: 14
