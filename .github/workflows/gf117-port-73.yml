name: GF117 CachyOS 7.3 source port
on:
  push:
    branches: ['research/gf117-cachyos-7.3.0-4']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out pinned Nouveau sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: CachyOS/linux
          ref: 6f1d90319ee9a72139f60d4547c2b44064ee2987
          sparse-checkout: drivers/gpu/drm/nouveau
          path: kernel-source
          persist-credentials: false
      - name: Apply patches and run source harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          experimental/cachyos-7.3.0-4/apply-and-test.sh "$GITHUB_WORKSPACE/kernel-source" 2>&1 | tee ci-output/source-check.log
      - name: Upload source test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gf117-73-source-${{ github.sha }}
          path: ci-output/
          if-no-files-found: warn
          retention-days: 14
